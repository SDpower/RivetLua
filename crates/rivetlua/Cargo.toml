[package]
name = "rivetlua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RivetLua 的公開 Rust SDK。"
readme = "README.md"

[features]
jit = ["rivetlua-runtime/jit"]
aot = ["rivetlua-runtime/aot", "dep:rivetlua-native"]
aot-builder = ["aot", "rivetlua-native/compiler"]
native-lua55 = ["dep:rivetlua-capi", "rivetlua-capi/lua55"]
native-lua54 = ["dep:rivetlua-capi", "rivetlua-capi/lua54"]

[dependencies]
rivetlua-core = { path = "../rivetlua-core" }
rivetlua-compiler = { path = "../rivetlua-compiler" }
rivetlua-runtime = { path = "../rivetlua-runtime" }
rivetlua-native = { path = "../rivetlua-native", optional = true, default-features = false }
rivetlua-capi = { path = "../rivetlua-capi", optional = true, default-features = false }
