[package]
name = "rivetlua-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RivetLua 固定 C SDK ABI 身分與清單。"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "rivetlua-native-worker"
path = "src/bin/rivetlua-native-worker.rs"

[features]
default = ["lua55"]
lua55 = []
lua54 = []

[dependencies]
allocator-api2 = { version = "=0.2.21", default-features = false, features = ["alloc"] }
libc = "=0.2.190"
rivetlua-alloc = { path = "../rivetlua-alloc" }
rivetlua-core = { path = "../rivetlua-core" }
rivetlua-compiler = { path = "../rivetlua-compiler" }
rivetlua-runtime = { path = "../rivetlua-runtime" }

[build-dependencies]
cc = "1"
