[package]
name = "rivetlua-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RivetLua 的共用契約骨架；尚未提供 Lua 語意。"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["rivetlua-alloc/std"]

[dependencies]
allocator-api2 = { version = "=0.2.21", default-features = false, features = ["alloc"] }
rivetlua-alloc = { path = "../rivetlua-alloc", default-features = false }
libm = { version = "0.2.16", default-features = false }

[dev-dependencies]
rivetlua-alloc = { path = "../rivetlua-alloc", default-features = false, features = ["test-support"] }
